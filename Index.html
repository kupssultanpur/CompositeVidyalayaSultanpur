<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कम्पोजिट विद्यालय सुल्तानपुर</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#173126}
header{background:#0b3b24;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0}
.hero{margin:16px;padding:25px;background:#17643a;color:white;border-radius:20px}
.hero h2{font-size:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:white;border:0;border-radius:16px;padding:20px;font-size:17px;box-shadow:0 3px 12px #0001}
.notice{margin:16px;padding:18px;background:white;border-radius:16px}
.notice h3{margin-top:0}
footer{text-align:center;padding:25px;color:#666}
button{width:100%;border:0}
</style>
</head>
<body>

<header>
<h1>🏫 कम्पोजिट विद्यालय सुल्तानपुर</h1>
<p>जनपद चंदौली, उत्तर प्रदेश</p>
</header>

<section class="hero">
<h2>विद्यालय में आपका स्वागत है</h2>
<p>विद्यालय की सूचनाएँ और महत्वपूर्ण सेवाएँ एक ही स्थान पर।</p>
</section>

<section class="notice">
<h3>📢 नवीन सूचना</h3>
<p>विद्यालय में नियमित रूप से शिक्षण कार्य संचालित हो रहा है।</p>
</section>

<div class="grid">
<button class="card">👨‍🎓<br>विद्यार्थी</button>
<button class="card">👩‍🏫<br>शिक्षक</button>
<button class="card">✅<br>उपस्थिति</button>
<button class="card">📢<br>सूचनाएँ</button>
<button class="card">🖼️<br>गैलरी</button>
<button class="card">📚<br>कक्षाएँ</button>
<button class="card">🏫<br>विद्यालय</button>
<button class="card">📞<br>संपर्क</button>
</div>

<footer>
© 2026 कम्पोजिट विद्यालय सुल्तानपुर
</footer>

</body>
</html>
